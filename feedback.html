<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Зворотній зв'язок — Клавіарня</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700;800&family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/feedback.css">
</head>
<body class="page-feedback">

<header class="site-header">
  <img class="logo" src="images/logo.png" alt="Логотип сервісного сайту Клавіарня" width="100" height="100">
  <h1 class="site-title">Клавіарня</h1>
  <p class="back-link"><a href="index.html">На Головну сторінку</a></p>
</header>

<main>
  <h2>Форма зворотного зв'язку</h2>

  <form action="#" method="post">

    <fieldset>
      <legend>Персональна інформація</legend>

      <p class="field field--grow">
        <label for="fio">Прізвище та ім'я</label>
        <input type="text" id="fio" name="fio" placeholder="Наприклад: Святий Павло" required>
      </p>

      <p class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
      </p>

      <p class="field field--narrow">
        <label for="age">Вік</label>
        <input type="number" id="age" name="age" min="14" max="100" required>
      </p>
    </fieldset>

    <p class="field">
      <label for="purpose">Мета зворотнього зв'язку</label>
      <select id="purpose" name="purpose" required>
        <option value="">— оберіть мету —</option>
        <option value="cooperation">Співпраця</option>
        <option value="complaint">Скарга на неякісну збірку</option>
        <option value="suggestion">Пропозиція</option>
        <option value="error">Наявність помилки</option>
      </select>
    </p>

    <p class="field">
      <label for="details">Детально</label>
      <textarea id="details" name="details" rows="6" cols="45" maxlength="500" placeholder="Опишіть, будь ласка, деталі звернення (до 500 символів)"></textarea>
    </p>

    <p class="field-check">
      <input type="checkbox" id="consent" name="consent" required>
      <label for="consent">Я погоджуюсь на обробку моїх персональних даних</label>
    </p>

    <p class="form-actions">
      <button type="submit" class="btn-submit">Надіслати</button>
      <button type="reset" class="btn-reset">Очистити форму</button>
    </p>

  </form>

  <p class="back-link"><a href="index.html">Повернутись на Головну сторінку</a></p>
</main>

<footer class="site-footer">
  <p class="copyright">© 2026 Клавіарня.</p>
</footer>

</body>
</html>
