<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Зворотній зв'язок — Клавіарня</title>
</head>
<body>

<header>
  <img src="images/logo.png" alt="Логотип сервісного сайту Клавіарня" width="100" height="100">
  <h1>Клавіарня</h1>
  <p><a href="index.html">На Головну сторінку</a></p>
</header>

<main>
  <h2>Форма зворотного зв'язку</h2>

  <form action="#" method="post">

    <fieldset>
      <legend>Персональна інформація</legend>

      <p>
        <label for="fio">Прізвище та ім'я</label>
        <input type="text" id="fio" name="fio" placeholder="Наприклад: Святий Павло" required>
      </p>

      <p>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
      </p>

      <p>
        <label for="age">Вік</label>
        <input type="number" id="age" name="age" min="14" max="100" required>
      </p>
    </fieldset>

    <p>
      <label for="purpose">Мета зворотнього зв'язку</label>
      <select id="purpose" name="purpose" required>
        <option value="">— оберіть мету —</option>
        <option value="cooperation">Співпраця</option>
        <option value="complaint">Скарга на неякісну збірку</option>
        <option value="suggestion">Пропозиція</option>
        <option value="error">Наявність помилки</option>
      </select>
    </p>

    <p>
      <label for="details">Детально</label>
      <textarea id="details" name="details" rows="6" cols="45" maxlength="500" placeholder="Опишіть, будь ласка, деталі звернення (до 500 символів)"></textarea>
    </p>

    <p>
      <input type="checkbox" id="consent" name="consent" required>
      <label for="consent">Я погоджуюсь на обробку моїх персональних даних</label>
    </p>

    <p>
      <button type="submit">Надіслати</button>
      <button type="reset">Очистити форму</button>
    </p>

  </form>

  <p><a href="index.html">Повернутись на Головну сторінку</a></p>
</main>

<footer>
  <p>© 2026 Клавіарня.</p>
</footer>

</body>
</html>
